<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Buttons</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4">

    <h1>Bootstrap Buttons</h1>
    <div class="mb-3"></div>

    <!-- Row 1: Solid Buttons with custom labels -->
    <div class="mb-3">
        <button type="button" class="btn btn-primary">Home</button>
        <button type="button" class="btn btn-success">Save</button>
        <button type="button" class="btn btn-danger">Delete</button>
        <button type="button" class="btn btn-warning">Edit</button>
        <button type="button" class="btn btn-info text-white">Search</button>
        <button type="button" class="btn btn-dark">Login</button>
        <button type="button" class="btn btn-light">Logout</button>
        <button type="button" class="btn btn-link">Link</button>
    </div>

    <!-- Row 2: Outline Buttons -->
    <div class="mb-3">
        <button type="button" class="btn btn-outline-primary">Primary</button>
        <button type="button" class="btn btn-outline-success">Success</button>
        <button type="button" class="btn btn-outline-danger">Danger</button>
        <button type="button" class="btn btn-outline-warning">Warning</button>
        <button type="button" class="btn btn-outline-dark">Dark</button>
    </div>

    <!-- Row 3: Button Sizes -->
    <div class="mb-3">
        <button type="button" class="btn btn-primary btn-sm">Small</button>
        <button type="button" class="btn btn-success">Normal</button>
        <button type="button" class="btn btn-danger btn-lg">Large</button>
    </div>

    <!-- Row 4: Disabled, Close Icon, Input, and Submit -->
    <div class="mb-3">
        <button type="button" class="btn btn-secondary" disabled>Disabled</button>
        <button type="button" class="btn-close" aria-label="Close"></button>
        <input type="button" class="btn btn-info text-white" value="Input Button">
        <input type="submit" class="btn btn-success" value="Submit">
    </div>

</body>
</html>
